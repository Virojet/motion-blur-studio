name: Windows checks
on:
  push:
    branches: ['main', 'codex/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec install-electron
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Install the pinned engine on the isolated runner
        shell: pwsh
        run: |
          node scripts/install-engine.mjs --destination artifacts/ci-engine
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify real CPU rendering
        run: pnpm verify:engine --engine artifacts/ci-engine --output artifacts/engine-verification
      - name: Check the desktop workflow
        env:
          MOTION_BLUR_ENGINE_DIR: ${{ github.workspace }}\artifacts\ci-engine
        run: node scripts/smoke-ui.mjs --cpu
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-validation
          path: |
            artifacts/engine-verification/report.json
            artifacts/ui-smoke/report.json
          if-no-files-found: ignore
